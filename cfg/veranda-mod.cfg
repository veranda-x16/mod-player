# The MOD player on Veranda (make veranda): the SDK's app-c-ovl.cfg with
# x16-mod's page-aligned segments and its zero page.
#
#   $0801 .. $85FF   MAIN    resident: the engine (everything the AFLOW
#                            interrupt runs), the loader, the main screen
#   $8600 .. $87FF   the C stack (512 bytes, as Veranda Calc's; the AFLOW
#                    batch has a stack of its own: src/mod_irq.s)
#   $A000 .. $BFFF   OVLn    banked overlays, run in place (app.hdr:
#                            overlays = banked; LoadOverlay). Overlay 1
#                            holds the step table (STEPTAB, 2,385 bytes):
#                            read only when a period is set, it costs no
#                            fixed RAM there (mod_tab_bank = its bank);
#                            2-4 the player's (examples/veranda/vmp.h)
#
# Zero page: ZEROPAGE (cc65's 26 bytes and the engine's 49: the mixer's
# hot loop needs them there) at $A9-$FF, which Veranda gives the
# application and DaRun puts aside with it; ZPBSS (the UI's) at $50-$7F.
# The ROM maths library's $A9-$D3 is not used by this program.
#
# ALIGNDATA (the volume table, 17 pages) and ALIGNBSS (the four voice cache
# pages) are page-aligned: the mixer's "lda cache,y" must not cross a page.
# They follow each other, so the alignment costs one gap, not two.
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0200;
    __STACKSTART__: type = weak, value = $8800;     # its top
}
MEMORY {
    ZP:   file = "", define = yes, start = $00A9, size = $0100 - $00A9;
    ZP2:  file = "", define = yes, start = $0050, size = $0030;
    MAIN: file = %O, define = yes, start = $0801, size = __STACKSTART__ - __STACKSIZE__ - $0801;
    OVL1: file = "%O.1", define = yes, start = $A000, size = $2000;
    OVL2: file = "%O.2", define = yes, start = $A000, size = $2000;
    OVL3: file = "%O.3", define = yes, start = $A000, size = $2000;
    OVL4: file = "%O.4", define = yes, start = $A000, size = $2000;
    OVL5: file = "%O.5", define = yes, start = $A000, size = $2000;
    OVL6: file = "%O.6", define = yes, start = $A000, size = $2000;
    OVL7: file = "%O.7", define = yes, start = $A000, size = $2000;
    OVL8: file = "%O.8", define = yes, start = $A000, size = $2000;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,   type = zp;
    EXTZP:     load = ZP,   type = zp, optional = yes;
    ZPBSS:     load = ZP2,  type = zp, define = yes, optional = yes;
    STARTUP:   load = MAIN, type = ro;
    LOWCODE:   load = MAIN, type = ro, optional = yes;
    ONCE:      load = MAIN, type = ro, optional = yes;
    CODE:      load = MAIN, type = ro;
    RODATA:    load = MAIN, type = ro;
    DATA:      load = MAIN, type = rw;
    INIT:      load = MAIN, type = rw, optional = yes;
    ALIGNDATA: load = MAIN, type = rw, align = $100, optional = yes;
    ALIGNBSS:  load = MAIN, type = bss, align = $100, optional = yes;
    BSS:       load = MAIN, type = bss, define = yes;
    STEPTAB:   load = OVL1, type = ro,  define = yes, optional = yes;
    OVERLAY1: load = OVL1, type = ro,  define = yes, optional = yes;
    OVL1RO:   load = OVL1, type = ro,  define = yes, optional = yes;
    OVL1BSS:  load = OVL1, type = bss, define = yes, optional = yes;
    OVERLAY2: load = OVL2, type = ro,  define = yes, optional = yes;
    OVL2RO:   load = OVL2, type = ro,  define = yes, optional = yes;
    OVL2BSS:  load = OVL2, type = bss, define = yes, optional = yes;
    OVERLAY3: load = OVL3, type = ro,  define = yes, optional = yes;
    OVL3RO:   load = OVL3, type = ro,  define = yes, optional = yes;
    OVL3BSS:  load = OVL3, type = bss, define = yes, optional = yes;
    OVERLAY4: load = OVL4, type = ro,  define = yes, optional = yes;
    OVL4RO:   load = OVL4, type = ro,  define = yes, optional = yes;
    OVL4BSS:  load = OVL4, type = bss, define = yes, optional = yes;
    OVERLAY5: load = OVL5, type = ro,  define = yes, optional = yes;
    OVL5RO:   load = OVL5, type = ro,  define = yes, optional = yes;
    OVL5BSS:  load = OVL5, type = bss, define = yes, optional = yes;
    OVERLAY6: load = OVL6, type = ro,  define = yes, optional = yes;
    OVL6RO:   load = OVL6, type = ro,  define = yes, optional = yes;
    OVL6BSS:  load = OVL6, type = bss, define = yes, optional = yes;
    OVERLAY7: load = OVL7, type = ro,  define = yes, optional = yes;
    OVL7RO:   load = OVL7, type = ro,  define = yes, optional = yes;
    OVL7BSS:  load = OVL7, type = bss, define = yes, optional = yes;
    OVERLAY8: load = OVL8, type = ro,  define = yes, optional = yes;
    OVL8RO:   load = OVL8, type = ro,  define = yes, optional = yes;
    OVL8BSS:  load = OVL8, type = bss, define = yes, optional = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__, count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__,
            segment = RODATA, import = __CALLIRQ__;
}
