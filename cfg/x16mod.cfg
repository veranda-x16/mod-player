# x16-mod linker config.
#
# Derived from cc65's cx16-asm.cfg, with page-aligned segments added. The
# mixer indexes its per-voice sample caches with an 8-bit register via
# "lda cache,y" -- if the buffer is not page-aligned those loads cross a page
# boundary and cost an extra cycle on most iterations, which both slows the
# hot loop and corrupts any cycle measurement taken over it.
#
# ALIGNBSS  : page-aligned zero-initialised buffers (voice caches, scratch)
# ALIGNDATA : page-aligned initialised tables

FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__: type = import;
    __HIMEM__:    type = weak, value = $9F00;
}
MEMORY {
    ZP:       file = "", start = $0022,  size = $0080 - $0022, define = yes;
    ZP2:      file = "", start = $00A9,  size = $0100 - $00A9;
    LOADADDR: file = %O, start = %S - 2, size = $0002;
    MAIN:     file = %O, start = %S,     size = __HIMEM__ - %S;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,       type = zp;
    EXTZP:     load = ZP2,      type = zp, optional = yes;
    LOADADDR:  load = LOADADDR, type = ro;
    EXEHDR:    load = MAIN,     type = ro, optional = yes;
    CODE:      load = MAIN,     type = ro;
    RODATA:    load = MAIN,     type = ro;
    ALIGNDATA: load = MAIN,     type = rw,  align = $100, optional = yes;
    STEPTAB:   load = MAIN,     type = ro,  optional = yes;
    DATA:      load = MAIN,     type = rw,  optional = yes;
    BSS:       load = MAIN,     type = bss, define = yes;
    ALIGNBSS:  load = MAIN,     type = bss, align = $100, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}
